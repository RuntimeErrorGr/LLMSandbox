[project]
name = "llm-sandbox"
version = "0.1.0"
description = "Agent Sandbox: AI agents build detectors for LLM training-data poisoning, deployed via GitOps"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "chromadb>=1.5.9",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.8.1",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "runner"]
testpaths = ["tests"]
