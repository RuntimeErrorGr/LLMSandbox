[project]
name = "llm-sandbox"
version = "0.1.0"
description = "Agent Sandbox: AI agents build detectors for LLM training-data poisoning, deployed via GitOps"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "chromadb>=1.5.9",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "jinja2>=3.1.6",
    "kubernetes>=37.0.2",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.8.1",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = [".", "runner"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "sandbox_sdk"]
