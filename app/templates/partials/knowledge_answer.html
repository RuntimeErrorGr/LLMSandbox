<article class="msg assistant">
  <div class="content">{{ answer }}</div>
  <footer>
    {% if sources %}
    <small>Sources:
      {% for doc, score in sources %}
      <mark>{{ doc.metadata.source }} › {{ doc.metadata.section }} ({{ "%.2f" | format(score) }})</mark>
      {% endfor %}
    </small>
    <details>
      <summary><small>Context sent to the LLM</small></summary>
      <pre class="chunk">{{ context }}</pre>
    </details>
    {% else %}
    <small>No chunk scored above the threshold, so the LLM was not called.</small>
    {% endif %}
  </footer>
</article>
