<div id="run-status"
     {% if run.state not in ["succeeded", "failed"] %}
     hx-get="/partials/runs/{{ run.id }}" hx-trigger="every 2s" hx-swap="outerHTML"
     {% endif %}>
  <article>
    <header>State: {% include "partials/run_state.html" %}
      {% if status.detail %}<small class="todo"> · {{ status.detail }}</small>{% endif %}
    </header>
    {% if status.result %}
    <p><strong>{{ status.result.summary }}</strong></p>
    <details open>
      <summary>result.json</summary>
      <pre class="chunk">{{ status.result | tojson(indent=2) }}</pre>
    </details>
    {% endif %}
    <details {% if not status.result %}open{% endif %}>
      <summary>Logs</summary>
      <pre class="chunk">{{ status.logs or "waiting for the pod to start…" }}</pre>
    </details>
  </article>
</div>
