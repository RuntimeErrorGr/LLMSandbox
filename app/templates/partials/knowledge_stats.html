{% if stats %}
<table>
  <thead><tr><th>Source</th><th>Chunks</th></tr></thead>
  <tbody>
    {% for source, count in stats.items() %}
    <tr><td>{{ source }}</td><td>{{ count }}</td></tr>
    {% endfor %}
  </tbody>
  <tfoot><tr><td>Total</td><td>{{ stats.values() | sum }}</td></tr></tfoot>
</table>
{% else %}
<p>The library is empty. Click <strong>Re-ingest</strong>.</p>
{% endif %}
