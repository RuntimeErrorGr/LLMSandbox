{% extends "base.html" %}
{% block title %}Chat · LLM Sandbox{% endblock %}
{% block content %}
<hgroup>
  <h1>Chat</h1>
  <p>First LangChain chain: <code>prompt | ChatOllama | StrOutputParser</code> on <code>{{ model }}</code></p>
</hgroup>

<div id="messages">
  {% include "partials/chat_messages.html" %}
</div>

<form hx-post="/chat" hx-target="#messages" hx-swap="beforeend"
      hx-indicator="#thinking" hx-disabled-elt="find button"
      hx-on::after-request="if (event.detail.successful) this.reset()">
  <fieldset role="group">
    <input name="question" placeholder="Ask something…" required autocomplete="off">
    <button type="submit">Send</button>
  </fieldset>
</form>
<p id="thinking" class="htmx-indicator" aria-busy="true">The model is thinking on your CPU…</p>

<button class="secondary outline" hx-post="/chat/clear" hx-target="#messages"
        hx-confirm="Delete the whole conversation?">Clear chat</button>
{% endblock %}
