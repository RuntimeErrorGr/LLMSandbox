apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RuntimeErrorGr/LLMSandbox.git
    targetRevision: main
    path: gitops/infra
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
