apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: sandbox-playground
spec:
  hard:
    pods: "6"
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "6"
    limits.memory: 8Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: sandbox-modules
spec:
  hard:
    pods: "10"
    requests.cpu: "6"
    requests.memory: 10Gi
    limits.cpu: "8"
    limits.memory: 12Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: per-container
  namespace: sandbox-playground
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 1Gi
      max:
        cpu: "4"
        memory: 6Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: per-container
  namespace: sandbox-modules
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 1Gi
      max:
        cpu: "4"
        memory: 6Gi
